<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ナンコネ</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
    <link rel="icon" sizes="96x96" href="./favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>

<body>
    <div class="app-content">
        <div class="header">
            <span>難易度：</span>
            <button class="level-button" data-level="easy">やさしい</button>
            <button class="level-button selected" data-level="normal">ふつう</button>
            <button class="level-button" data-level="hard">むずかしい</button>
        </div>
        <div class="board">
            <div class="board-border">
                <div class="board-content"></div>
                <div class="board-mask"></div>
                <div class="clear-popup-container">
                    <div class="clear-popup">
                        <span>クリア！</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./script.js"></script>
</body>

</html>
